# Production deploy (plan rev 3): push to main (the owner's merge IS the
# gate), plus the reviewer-protected environment holding the single deploy
# token. Deploys the assets-only site worker; the chat-api worker deploy is
# wired in only when M6 lands its full pipeline and tests.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: deploy-production

jobs:
  production:
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Deploy site worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config workers/site/wrangler.jsonc
      - name: Record artifact hash and deployment id (paired rollback evidence)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd out
          find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | tee -a "$GITHUB_STEP_SUMMARY"
          cd ..
          npx wrangler deployments list --config workers/site/wrangler.jsonc 2>/dev/null | head -12 | tee -a "$GITHUB_STEP_SUMMARY" || true
