# Secretless PR pipeline: builds, tests and gates every PR.
# It never sees a secret; production deploys happen from main
# through deploy.yml.
name: pr-ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --config workers/site/wrangler.jsonc --dry-run
      - run: npm run layout:gate
      - run: node scripts/perf-gate.mjs
