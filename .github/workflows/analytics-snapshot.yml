name: Refresh analytics snapshot

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # Dispatch deploy.yml after a successful snapshot push.

concurrency:
  group: analytics-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .node-version
      - name: Fetch analytics snapshot
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: node scripts/fetch-analytics.mjs
      - name: Commit refreshed snapshot
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add -- content/analytics-snapshot.json
          if git diff --cached --quiet; then
            echo "::notice::Analytics snapshot is unchanged; nothing to commit or deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          to_date="$(node -p "require('./content/analytics-snapshot.json').range.to")"
          git commit -m "chore(analytics): refresh snapshot through ${to_date}"
          if ! git push origin HEAD:refs/heads/main; then
            echo "::error::Snapshot push to main failed. If main advanced during the refresh, rerun this workflow."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch data-only deploy if configured
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if environment_error="$(gh api --method GET "repos/${{ github.repository }}/environments/deploy-auto" 2>&1 >/dev/null)"; then
            echo "::notice::Environment deploy-auto exists; dispatching deploy.yml with data_only=true on main."
            gh workflow run deploy.yml --ref main -f data_only=true
          elif [[ "$environment_error" == *"(HTTP 404)"* ]]; then
            echo "::notice::Environment deploy-auto does not exist; the committed snapshot will ride the next regular deploy."
            exit 0
          else
            printf '%s\n' "$environment_error" >&2
            echo "::error::Could not check deploy-auto; refusing to dispatch a deployment."
            exit 1
          fi
